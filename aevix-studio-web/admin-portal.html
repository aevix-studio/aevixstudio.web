<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Admin Portal | Aevix Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1f2937;
        }
        .admin-nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            background: #111827;
            color: #9ca3af;
            border: 1px solid #1f2937;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: #fff;
            border-color: #374151;
        }
        .tab-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .admin-table-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }
        .admin-table th {
            background: #1f2937;
            color: #9ca3af;
            padding: 16px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        .admin-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #1f2937;
            color: #e5e7eb;
            vertical-align: middle;
        }
        .admin-table tr:last-child td {
            border-bottom: none;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .badge-pending { background: rgba(234, 179, 8, 0.15); color: #facc15; }
        .badge-active { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-completed { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .logout-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #ef4444;
            color: #fff;
        }
        .select-inline {
            background: #0b0f17;
            border: 1px solid #374151;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>

    <section class="section-container" style="max-width: 1300px; margin: 0 auto; padding: 2rem 1rem;">
        <div class="portal-header">
            <div>
                <h2>Team Operations Workspace</h2>
                <p class="section-lead" style="margin: 0;">Manage ongoing projects, client inquiries, and billing details.</p>
            </div>
            <button id="logout-btn" class="logout-btn" style="display: none;">Sign Out</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="admin-nav-tabs" id="tab-controls" style="display: none;">
            <button class="tab-btn active" onclick="switchTab('projects', event)">Project Overview</button>
            <button class="tab-btn" onclick="switchTab('inquiries', event)">Client & Inquiries</button>
            <button class="tab-btn" onclick="switchTab('payments', event)">Payments & Invoices</button>
        </div>

        <div id="workspace-content">
            <p style="color: #9ca3af;">Verifying administrative permissions...</p>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { flowType: 'pkce', autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
        });

        const workspaceContent = document.getElementById('workspace-content');
        const logoutBtn = document.getElementById('logout-btn');
        const tabControls = document.getElementById('tab-controls');
        let currentTab = 'projects';

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        async function checkUserPermissions(session) {
            if (!session) {
                renderAccessDenied("Authentication required to access this workspace.");
                logoutBtn.style.display = 'none';
                tabControls.style.display = 'none';
                return;
            }

            if (session.user.email === 'aevixstudio961@gmail.com') {
                grantAccess();
                return;
            }

            try {
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (profile && ['admin', 'team'].includes(profile.role)) {
                    grantAccess();
                } else {
                    renderAccessDenied(`Access Denied: Account (${session.user.email}) does not have administrative permissions.`);
                }
            } catch (err) {
                renderAccessDenied("An error occurred while checking permissions.");
            }
        }

        function grantAccess() {
            logoutBtn.style.display = 'inline-block';
            tabControls.style.display = 'flex';
            loadActiveTab();
        }

        function switchTab(tabName, evt) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
            loadActiveTab();
        }

        function loadActiveTab() {
            if (currentTab === 'projects') fetchProjects();
            else if (currentTab === 'inquiries') fetchInquiries();
            else if (currentTab === 'payments') fetchPayments();
        }

        /* --- 1. PROJECT OVERVIEW TABLE --- */
        async function fetchProjects() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading projects...</div>`;
            const { data: projects, error } = await supabase.from('projects').select('*').order('created_at', { ascending: false });

            if (error || !projects || !projects.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No active projects found.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client Name</th>
                                <th>Project Title</th>
                                <th>Status</th>
                                <th>Deadline</th>
                                <th>Budget</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            projects.forEach(p => {
                const statusClass = p.status === 'Completed' ? 'badge-completed' : (p.status === 'In Progress' ? 'badge-active' : 'badge-pending');
                html += `
                    <tr>
                        <td><strong>${escapeHtml(p.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(p.project_title || 'N/A')}</td>
                        <td><span class="badge ${statusClass}">${escapeHtml(p.status || 'Pending')}</span></td>
                        <td>${p.deadline ? escapeHtml(p.deadline) : 'N/A'}</td>
                        <td>$${p.budget ? Number(p.budget).toLocaleString() : '0.00'}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        /* --- 2. CLIENT & INQUIRY TRACKER --- */
        async function fetchInquiries() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading inquiries...</div>`;
            const { data: inquiries, error } = await supabase.from('inquiries').select('*').order('created_at', { ascending: false });

            if (error || !inquiries || !inquiries.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No submissions or client inquiries found.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Email</th>
                                <th>Service</th>
                                <th>Message</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            inquiries.forEach(i => {
                html += `
                    <tr>
                        <td><strong>${escapeHtml(i.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(i.email || 'N/A')}</td>
                        <td>${escapeHtml(i.service_requested || 'General')}</td>
                        <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${escapeHtml(i.message || '')}">${escapeHtml(i.message || 'N/A')}</td>
                        <td><span class="badge badge-active">${escapeHtml(i.status || 'New')}</span></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        /* --- 3. PAYMENT & INVOICE STATUS --- */
        async function fetchPayments() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading payment details...</div>`;
            const { data: payments, error } = await supabase.from('payments').select('*').order('created_at', { ascending: false });

            if (error || !payments || !payments.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No payment records found.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Milestone</th>
                                <th>Amount</th>
                                <th>Due Date</th>
                                <th>Payment Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            payments.forEach(pm => {
                const statusClass = pm.status === 'Paid' ? 'badge-completed' : 'badge-pending';
                html += `
                    <tr>
                        <td><strong>${escapeHtml(pm.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(pm.milestone || 'N/A')}</td>
                        <td>$${pm.amount ? Number(pm.amount).toLocaleString() : '0.00'}</td>
                        <td>${pm.due_date ? escapeHtml(pm.due_date) : 'N/A'}</td>
                        <td><span class="badge ${statusClass}">${escapeHtml(pm.status || 'Unpaid')}</span></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        function renderAccessDenied(message) {
            tabControls.style.display = 'none';
            workspaceContent.innerHTML = `
                <div style="text-align: center; padding: 4rem 2rem; background: #111827; border: 1px solid #1f2937; border-radius: 12px;">
                    <h3 style="color: #ef4444; margin-top: 0;">Restricted Access</h3>
                    <p style="color: #9ca3af; margin-bottom: 1.5rem;">${escapeHtml(message)}</p>
                    <a href="index.html" style="color: #60a5fa; text-decoration: underline;">Return to Main Site</a>
                </div>
            `;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        (async () => {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                await checkUserPermissions(session);
            } catch (err) {
                renderAccessDenied("Authentication error. Please sign in again.");
            }
        })();

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_OUT') renderAccessDenied("Authentication required to access this workspace.");
        });
    </script>
</body>
</html>
