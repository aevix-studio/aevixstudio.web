<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Aevix Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0b0f17;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #1d4ed8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #f59e0b;
            --input-bg: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 3rem;
        }

        .portal-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .user-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Access Denied Overlay */
        .unauthorized-card {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 500px;
            margin: 4rem auto;
        }

        .unauthorized-card h2 {
            color: var(--accent-red);
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .unauthorized-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .stat-card .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* Standard Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.75rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 1.25rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: var(--accent-blue);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Buttons */
        .action-btn {
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .action-btn:hover { background: var(--accent-blue-hover); }

        .btn-danger {
            background: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.15);
        }

        .logout-btn {
            background: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .logout-btn:hover {
            background: rgba(248, 113, 113, 0.15);
        }

        /* Nav Tabs */
        .tab-bar {
            display: flex;
            gap: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.85rem 0.25rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: var(--bg-dark);
            color: var(--text-muted);
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: #e5e7eb;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-paid, .status-completed, .status-active {
            background: rgba(74, 222, 128, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .status-pending, .status-in-progress, .status-working {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-overdue, .status-delayed, .status-cancelled {
            background: rgba(248, 113, 113, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <!-- Main Top Bar -->
        <div class="admin-header">
            <div>
                <h1 class="admin-title">Aevix Studio Admin Portal</h1>
                <div id="user-info-display" class="user-info">Verifying system access...</div>
            </div>
            <button id="admin-logout-btn" class="logout-btn" style="display: none;">Sign Out</button>
        </div>

        <!-- System View Area -->
        <div id="admin-main-view">
            <p style="color: var(--text-muted); text-align: center; padding: 4rem 0;">Authenticating credentials...</p>
        </div>
    </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';

        let supabaseClient = null;

        // XSS Prevention Utility
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Initialize Supabase Client safely
        function getSupabase() {
            if (!supabaseClient) {
                const config = {
                    auth: {
                        flowType: 'pkce',
                        autoRefreshToken: true,
                        persistSession: true,
                        detectSessionInUrl: true
                    }
                };
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, config);
                } else if (typeof createClient === 'function') {
                    supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, config);
                }
            }
            return supabaseClient;
        }

        const mainView = document.getElementById('admin-main-view');
        const logoutBtn = document.getElementById('admin-logout-btn');
        const userInfoDisplay = document.getElementById('user-info-display');

        // Logout Handler
        logoutBtn.addEventListener('click', async () => {
            const client = getSupabase();
            if (client) {
                await client.auth.signOut();
            }
            window.location.replace('index.html');
        });

        // Strict Authorization Check
        async function checkAdminAuthorization(session) {
            if (!session || !session.user) {
                window.location.replace('index.html');
                return false;
            }

            const email = (session.user.email || '').toLowerCase();
            const userMetadata = session.user.user_metadata || {};
            const appMetadata = session.user.app_metadata || {};

            // Check if account is admin authorized
            const isAdmin = email === 'dahiyatdanesh@gmail.com' || 
                            userMetadata.role === 'admin' || 
                            appMetadata.role === 'admin' || 
                            userMetadata.is_admin === true;

            if (!isAdmin) {
                renderUnauthorizedView(email);
                return false;
            }

            userInfoDisplay.textContent = `Administrator: ${email}`;
            logoutBtn.style.display = 'inline-block';
            return true;
        }

        function renderUnauthorizedView(email) {
            userInfoDisplay.textContent = `Signed in as: ${email}`;
            logoutBtn.style.display = 'inline-block';
            
            mainView.innerHTML = `
                <div class="unauthorized-card">
                    <h2>Access Denied</h2>
                    <p>Your account (<strong>${escapeHtml(email)}</strong>) does not have administrator privileges to access this area.</p>
                    <button class="action-btn" onclick="window.location.href='client-portal.html'">Go to Client Portal</button>
                </div>
            `;

            setTimeout(() => {
                window.location.replace('client-portal.html');
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const client = getSupabase();
            if (!client) {
                mainView.innerHTML = `<p style="color: var(--accent-red); text-align: center;">Failed to connect to authentication server.</p>`;
                return;
            }

            const { data: { session } } = await client.auth.getSession();
            const authorized = await checkAdminAuthorization(session);

            if (authorized) {
                await loadAdminDashboard();
            }

            client.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') {
                    const ok = await checkAdminAuthorization(session);
                    if (ok) await loadAdminDashboard();
                } else if (event === 'SIGNED_OUT' || !session) {
                    window.location.replace('index.html');
                }
            });
        });

        // Fetch All Database Records
        async function loadAdminDashboard() {
            const client = getSupabase();

            const [projectsRes, paymentsRes, logsRes, inquiriesRes] = await Promise.all([
                client.from('projects').select('*').order('created_at', { ascending: false }),
                client.from('payments').select('*').order('created_at', { ascending: false }),
                client.from('activity_logs').select('*').order('created_at', { ascending: false }),
                client.from('inquiries').select('*').order('created_at', { ascending: false })
            ]);

            const projects = projectsRes.data || [];
            const payments = paymentsRes.data || [];
            const logs = logsRes.data || [];
            const inquiries = inquiriesRes.data || [];

            renderAdminUI(projects, payments, logs, inquiries);
        }

        // Render Complete Dashboard UI
        function renderAdminUI(projects, payments, logs, inquiries) {
            const totalRevenue = payments
                .filter(p => (p.status || p.payment_status || '').toLowerCase() === 'paid')
                .reduce((sum, p) => sum + (Number(p.amount) || 0), 0);

            const activeProjectsCount = projects.filter(p => (p.status || '').toLowerCase() !== 'completed').length;

            mainView.innerHTML = `
                <!-- Analytics Overview Counters -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">Total Revenue Collected</div>
                        <div class="value" style="color: var(--accent-green);">$${totalRevenue.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Active Projects</div>
                        <div class="value">${activeProjectsCount}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Total Inquiries</div>
                        <div class="value">${inquiries.length}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Total Logged Payments</div>
                        <div class="value">${payments.length}</div>
                    </div>
                </div>

                <!-- Tab Navigation Bar -->
                <div class="tab-bar">
                    <button class="tab-btn active" onclick="switchTab('tab-projects', this)">Projects Management</button>
                    <button class="tab-btn" onclick="switchTab('tab-payments', this)">Payment Ledger</button>
                    <button class="tab-btn" onclick="switchTab('tab-logs', this)">Activity Timeline Logs</button>
                    <button class="tab-btn" onclick="switchTab('tab-inquiries', this)">Inquiry Inbox (${inquiries.length})</button>
                </div>

                <!-- Tab 1: Projects Management -->
                <div id="tab-projects" class="tab-content active">
                    <div class="card">
                        <h3 class="section-title">Create New Client Project</h3>
                        <form id="create-project-form">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Project Title / Name</label>
                                    <input type="text" id="proj-title" required placeholder="e.g. E-Commerce Redesign">
                                </div>
                                <div class="form-group">
                                    <label>Client Email</label>
                                    <input type="email" id="proj-client-email" required placeholder="client@company.com">
                                </div>
                                <div class="form-group">
                                    <label>Client Name / Company</label>
                                    <input type="text" id="proj-client-name" placeholder="Acme Corp">
                                </div>
                                <div class="form-group">
                                    <label>Project Status</label>
                                    <select id="proj-status">
                                        <option value="In Progress">In Progress</option>
                                        <option value="Pending Review">Pending Review</option>
                                        <option value="Completed">Completed</option>
                                        <option value="On Hold">On Hold</option>
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label>Project Scope / Description</label>
                                    <textarea id="proj-description" placeholder="Brief details about deliverable milestones..."></textarea>
                                </div>
                            </div>
                            <button type="submit" class="action-btn">Create Project Record</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3 class="section-title">Existing Projects Directory</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Project Title</th>
                                        <th>Client Email</th>
                                        <th>Client Name</th>
                                        <th>Status</th>
                                        <th>Created Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${projects.length === 0 ? '<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No active projects found.</td></tr>' : ''}
                                    ${projects.map(p => `
                                        <tr>
                                            <td><strong>${escapeHtml(p.title || p.project_name || 'Untitled Project')}</strong></td>
                                            <td>${escapeHtml(p.client_email || p.email || 'N/A')}</td>
                                            <td>${escapeHtml(p.client_name || '-')}</td>
                                            <td><span class="status-badge status-${(p.status || 'in-progress').toLowerCase().replace(/\s+/g, '-')}">${escapeHtml(p.status || 'In Progress')}</span></td>
                                            <td>${new Date(p.created_at).toLocaleDateString()}</td>
                                            <td>
                                                <button class="btn-danger" onclick="deleteProject('${p.id}')">Delete</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Tab 2: Payments Ledger -->
                <div id="tab-payments" class="tab-content">
                    <div class="card">
                        <h3 class="section-title">Record Payment / Invoice</h3>
                        <form id="create-payment-form">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Client Name / Email</label>
                                    <input type="text" id="pay-client" required placeholder="e.g. John Doe / client@gmail.com">
                                </div>
                                <div class="form-group">
                                    <label>Amount ($ USD)</label>
                                    <input type="number" id="pay-amount" step="0.01" required placeholder="1250.00">
                                </div>
                                <div class="form-group">
                                    <label>Milestone / Note</label>
                                    <input type="text" id="pay-milestone" placeholder="50% Upfront Deposit">
                                </div>
                                <div class="form-group">
                                    <label>Payment Status</label>
                                    <select id="pay-status">
                                        <option value="Paid">Paid</option>
                                        <option value="Pending">Pending</option>
                                        <option value="Overdue">Overdue</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="action-btn">Log Payment Entry</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3 class="section-title">All Transactions & Payments</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Client</th>
                                        <th>Milestone / Details</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${payments.length === 0 ? '<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No payment entries found.</td></tr>' : ''}
                                    ${payments.map(p => `
                                        <tr>
                                            <td>${new Date(p.created_at || p.due_date || Date.now()).toLocaleDateString()}</td>
                                            <td>${escapeHtml(p.client_name || p.email || 'N/A')}</td>
                                            <td>${escapeHtml(p.milestone || p.notes || 'General Payment')}</td>
                                            <td>$${Number(p.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                                            <td><span class="status-badge status-${(p.status || p.payment_status || 'paid').toLowerCase()}">${escapeHtml(p.status || p.payment_status || 'Paid')}</span></td>
                                            <td>
                                                <button class="btn-danger" onclick="deletePayment('${p.id}')">Delete</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Tab 3: Timeline Logs -->
                <div id="tab-logs" class="tab-content">
                    <div class="card">
                        <h3 class="section-title">Post New Timeline Activity</h3>
                        <form id="create-log-form">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Target Project</label>
                                    <select id="log-project-id" required>
                                        <option value="">-- Select Project --</option>
                                        ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.title || p.project_name || 'Untitled Project')}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label>Activity Update Details</label>
                                    <textarea id="log-text" required placeholder="Completed database schema migration and deployed staging build..."></textarea>
                                </div>
                            </div>
                            <button type="submit" class="action-btn">Post Update to Project</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3 class="section-title">Recent Activity Audit Logs</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Timestamp</th>
                                        <th>Project ID</th>
                                        <th>Log Message</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${logs.length === 0 ? '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No activity logs recorded.</td></tr>' : ''}
                                    ${logs.map(l => `
                                        <tr>
                                            <td style="white-space: nowrap;">${new Date(l.created_at).toLocaleString()}</td>
                                            <td><code>${escapeHtml(l.project_id || '-')}</code></td>
                                            <td>${escapeHtml(l.log_text || l.message || l.activity || '')}</td>
                                            <td>
                                                <button class="btn-danger" onclick="deleteLog('${l.id}')">Delete</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Tab 4: Inquiry Inbox -->
                <div id="tab-inquiries" class="tab-content">
                    <div class="card">
                        <h3 class="section-title">Client Contact & Website Inquiries</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Subject / Scope</th>
                                        <th>Message</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${inquiries.length === 0 ? '<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No contact inquiries received yet.</td></tr>' : ''}
                                    ${inquiries.map(i => `
                                        <tr>
                                            <td style="white-space: nowrap;">${new Date(i.created_at).toLocaleDateString()}</td>
                                            <td><strong>${escapeHtml(i.name || i.client_name || 'Anonymous')}</strong></td>
                                            <td>${escapeHtml(i.email || '-')}</td>
                                            <td>${escapeHtml(i.subject || i.service || 'General Inquiry')}</td>
                                            <td>${escapeHtml(i.message || '-')}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            // Form Submit Event Handlers
            document.getElementById('create-project-form').addEventListener('submit', handleProjectSubmit);
            document.getElementById('create-payment-form').addEventListener('submit', handlePaymentSubmit);
            document.getElementById('create-log-form').addEventListener('submit', handleLogSubmit);
        }

        // Tab Switcher
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // Action Handlers
        async function handleProjectSubmit(e) {
            e.preventDefault();
            const client = getSupabase();

            const payload = {
                title: document.getElementById('proj-title').value,
                project_name: document.getElementById('proj-title').value,
                client_email: document.getElementById('proj-client-email').value,
                client_name: document.getElementById('proj-client-name').value,
                status: document.getElementById('proj-status').value,
                description: document.getElementById('proj-description').value
            };

            const { error } = await client.from('projects').insert([payload]);

            if (error) {
                alert('Failed to create project: ' + error.message);
            } else {
                alert('Project created successfully!');
                loadAdminDashboard();
            }
        }

        async function handlePaymentSubmit(e) {
            e.preventDefault();
            const client = getSupabase();

            const payload = {
                client_name: document.getElementById('pay-client').value,
                amount: parseFloat(document.getElementById('pay-amount').value),
                milestone: document.getElementById('pay-milestone').value || 'Payment',
                status: document.getElementById('pay-status').value,
                payment_status: document.getElementById('pay-status').value
            };

            const { error } = await client.from('payments').insert([payload]);

            if (error) {
                alert('Failed to log payment: ' + error.message);
            } else {
                alert('Payment logged successfully!');
                loadAdminDashboard();
            }
        }

        async function handleLogSubmit(e) {
            e.preventDefault();
            const client = getSupabase();

            const payload = {
                project_id: document.getElementById('log-project-id').value,
                log_text: document.getElementById('log-text').value
            };

            const { error } = await client.from('activity_logs').insert([payload]);

            if (error) {
                alert('Failed to post activity log: ' + error.message);
            } else {
                alert('Activity log posted successfully!');
                loadAdminDashboard();
            }
        }

        // Deletion Handlers
        async function deleteProject(id) {
            if (!confirm('Are you sure you want to delete this project record?')) return;
            const client = getSupabase();
            const { error } = await client.from('projects').delete().eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadAdminDashboard();
        }

        async function deletePayment(id) {
            if (!confirm('Are you sure you want to delete this payment entry?')) return;
            const client = getSupabase();
            const { error } = await client.from('payments').delete().eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadAdminDashboard();
        }

        async function deleteLog(id) {
            if (!confirm('Are you sure you want to remove this log entry?')) return;
            const client = getSupabase();
            const { error } = await client.from('activity_logs').delete().eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadAdminDashboard();
        }
    </script>
</body>
</html>
