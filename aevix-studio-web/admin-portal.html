<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Aevix Studio</title>
    <!-- Core Dependencies -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & VARIABLES
           ========================================================================== */
        :root {
            --bg-dark: #07090e;
            --bg-darker: #030407;
            --card-bg: #0f172a;
            --card-bg-hover: #1e293b;
            --border-color: #1e293b;
            --border-color-light: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #10b981;
            --accent-green-bg: rgba(16, 185, 129, 0.12);
            --accent-red: #ef4444;
            --accent-red-bg: rgba(239, 68, 68, 0.12);
            --accent-yellow: #f59e0b;
            --accent-yellow-bg: rgba(245, 158, 11, 0.12);
            --accent-purple: #8b5cf6;
            --input-bg: #1e293b;
            --input-border: #334155;
            --input-focus: #3b82f6;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --transition-speed: 0.2s;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        body { padding-bottom: 4rem; }

        /* ==========================================================================
           2. CONTAINERS & HEADER
           ========================================================================== */
        .portal-container { max-width: 1320px; margin: 0 auto; padding: 2.5rem 1.5rem; }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-brand { display: flex; align-items: center; gap: 1.25rem; }
        .brand-logo-badge {
            width: 46px; height: 46px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.35rem; color: #ffffff;
            box-shadow: var(--shadow-md);
        }

        .admin-title { font-size: 1.75rem; font-weight: 700; color: #ffffff; letter-spacing: -0.025em; }
        .user-info { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); display: inline-block; }

        /* ==========================================================================
           3. PROGRESS BAR & BADGES
           ========================================================================== */
        .progress-container { width: 100%; background-color: #1e293b; border-radius: 999px; height: 8px; overflow: hidden; margin-top: 6px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-green)); border-radius: 999px; transition: width 0.3s ease; }
        .progress-text { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }

        /* ==========================================================================
           4. DASHBOARD STAT CARDS & CARDS
           ========================================================================== */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.5rem; transition: all var(--transition-speed) ease; }
        .stat-card:hover { border-color: var(--border-color-light); transform: translateY(-2px); }
        .stat-card .label { font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.06em; margin-bottom: 0.65rem; font-weight: 600; }
        .stat-card .value { font-size: 2.1rem; font-weight: 800; color: #ffffff; line-height: 1.1; }
        .stat-card .subtext { font-size: 0.8rem; color: var(--text-dark); margin-top: 0.5rem; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; margin-bottom: 2.5rem; box-shadow: var(--shadow-lg); }
        .section-title { margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 600; color: #ffffff; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 0.75rem; }

        /* ==========================================================================
           5. FORMS, INPUTS & BUTTONS
           ========================================================================== */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

        .form-group input, .form-group select, .form-group textarea {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-size: 0.925rem; outline: none; transition: all var(--transition-speed) ease; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--input-focus); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .form-group textarea { resize: vertical; min-height: 100px; }

        .action-btn { background: var(--accent-blue); color: #ffffff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.925rem; transition: all var(--transition-speed) ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .action-btn:hover { background: var(--accent-blue-hover); transform: translateY(-1px); }
        .btn-danger { background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.825rem; font-weight: 500; transition: all var(--transition-speed) ease; }
        .btn-danger:hover { background: var(--accent-red-bg); }
        .logout-btn { background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); padding: 9px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.875rem; transition: all var(--transition-speed) ease; }
        .logout-btn:hover { background: var(--accent-red-bg); }

        /* ==========================================================================
           6. NAVIGATION TABS & TABLES
           ========================================================================== */
        .tab-bar { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 2.5rem; overflow-x: auto; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 1rem 0.5rem; cursor: pointer; font-weight: 500; font-size: 0.95rem; border-bottom: 2px solid transparent; white-space: nowrap; transition: all var(--transition-speed) ease; display: flex; align-items: center; gap: 0.5rem; }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); font-weight: 600; }
        .tab-badge { background: var(--input-bg); color: var(--text-muted); font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-color); }
        .tab-btn.active .tab-badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border-color: rgba(59, 130, 246, 0.3); }

        .table-responsive { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background: var(--bg-darker); color: var(--text-muted); padding: 14px 18px; font-weight: 600; border-bottom: 1px solid var(--border-color); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        td { padding: 16px 18px; border-bottom: 1px solid var(--border-color); color: #e2e8f0; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.015); }

        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; }
        .status-paid, .status-completed { background: var(--accent-green-bg); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-pending, .status-in-progress { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .status-overdue, .status-cancelled { background: var(--accent-red-bg); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .empty-state { padding: 4rem 1rem; text-align: center; color: var(--text-muted); }
        .client-id-pill { font-family: monospace; font-size: 0.75rem; background: var(--input-bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color); color: var(--accent-purple); }
    </style>
</head>
<body>

    <div class="portal-container">
        <!-- Top Navigation Header -->
        <header class="admin-header">
            <div class="header-brand">
                <div class="brand-logo-badge">A</div>
                <div>
                    <h1 class="admin-title">Admin Control Portal</h1>
                    <div id="user-info-display" class="user-info">
                        <span class="status-dot"></span>
                        <span>Verifying system permissions...</span>
                    </div>
                </div>
            </div>
            <button id="admin-logout-btn" class="logout-btn" style="display: none;">Sign Out</button>
        </header>

        <!-- Main View Area -->
        <main id="admin-main-view">
            <div class="empty-state">
                <p style="font-size: 1.1rem; color: var(--text-muted);">Verifying live session & administrative authority...</p>
            </div>
        </main>
    </div>

    <script>
        /* ==========================================================================
           SUPABASE CONSTANTS & INSTANCE INITIALIZATION
           ========================================================================== */
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';

        let supabaseClient = null;

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getSupabase() {
            if (!supabaseClient) {
                const config = {
                    auth: {
                        flowType: 'pkce',
                        autoRefreshToken: true,
                        persistSession: true,
                        detectSessionInUrl: true
                    }
                };
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, config);
                } else if (typeof createClient === 'function') {
                    supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, config);
                }
            }
            return supabaseClient;
        }

        const mainView = document.getElementById('admin-main-view');
        const logoutBtn = document.getElementById('admin-logout-btn');
        const userInfoDisplay = document.getElementById('user-info-display');

        /* ==========================================================================
           FAILSAFE AUTHENTICATION & AUTHORIZATION SYSTEM
           ========================================================================== */
        logoutBtn.addEventListener('click', async () => {
            const client = getSupabase();
            if (client) await client.auth.signOut();
            window.location.replace('index.html');
        });

        async function verifyAdminAuthority(session) {
            if (!session || !session.user) {
                window.location.replace('index.html');
                return false;
            }

            const email = (session.user.email || '').toLowerCase();
            const userId = session.user.id;
            const client = getSupabase();

            let isAdmin = false;

            try {
                const { data: prof, error: profErr } = await client
                    .from('profiles')
                    .select('role, is_admin')
                    .eq('id', userId)
                    .maybeSingle();

                if (prof && !profErr) {
                    if (prof.role === 'admin' || prof.is_admin === true) {
                        isAdmin = true;
                    }
                }
            } catch (e) {
                console.warn('Profiles table check bypassed due to policy restriction.');
            }

            if (!isAdmin) {
                try {
                    const { data: adm, error: admErr } = await client
                        .from('admin_users')
                        .select('email')
                        .eq('email', email)
                        .maybeSingle();

                    if (adm && !admErr) isAdmin = true;
                } catch (e) {
                    console.warn('admin_users table query bypassed.');
                }
            }

            if (!isAdmin) {
                const userMeta = session.user.user_metadata || {};
                const appMeta = session.user.app_metadata || {};
                if (userMeta.role === 'admin' || appMeta.role === 'admin' || userMeta.is_admin === true) {
                    isAdmin = true;
                }
            }

            if (!isAdmin) {
                renderAccessDenied(email);
                return false;
            }

            userInfoDisplay.innerHTML = `
                <span class="status-dot"></span>
                <span>Authorized Admin: <strong>${escapeHtml(email)}</strong></span>
            `;
            logoutBtn.style.display = 'inline-block';
            return true;
        }

        function renderAccessDenied(email) {
            userInfoDisplay.innerHTML = `
                <span class="status-dot" style="background-color: var(--accent-red); box-shadow: 0 0 8px var(--accent-red);"></span>
                <span>Account: ${escapeHtml(email)}</span>
            `;
            logoutBtn.style.display = 'inline-block';
            
            mainView.innerHTML = `
                <div class="empty-state">
                    <h2 style="color: var(--accent-red);">Access Denied</h2>
                    <p style="margin-top: 10px;">Your account (<strong>${escapeHtml(email)}</strong>) is not authorized as an admin. Redirecting...</p>
                </div>
            `;

            setTimeout(() => {
                window.location.replace('client-portal.html');
            }, 3000);
        }

        /* ==========================================================================
           INITIALIZATION & LISTENERS
           ========================================================================== */
        document.addEventListener('DOMContentLoaded', async () => {
            const client = getSupabase();
            if (!client) return;

            const { data: { session } } = await client.auth.getSession();
            const isAuthorized = await verifyAdminAuthority(session);

            if (isAuthorized) {
                await loadAdminDashboard();
            }

            client.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                    const ok = await verifyAdminAuthority(session);
                    if (ok) await loadAdminDashboard();
                } else if (event === 'SIGNED_OUT') {
                    window.location.replace('index.html');
                }
            });
        });

        /* ==========================================================================
           DATA LOADING & UI RENDERERS
           ========================================================================== */
        async function loadAdminDashboard() {
            const client = getSupabase();

            const [projectsRes, paymentsRes, logsRes, inquiriesRes] = await Promise.all([
                client.from('projects').select('*').order('created_at', { ascending: false }),
                client.from('payments').select('*').order('created_at', { ascending: false }),
                client.from('activity_logs').select('*').order('created_at', { ascending: false }),
                client.from('inquiries').select('*').order('created_at', { ascending: false })
            ]);

            renderDashboardUI(
                projectsRes.data || [],
                paymentsRes.data || [],
                logsRes.data || [],
                inquiriesRes.data || []
            );
        }

        function renderDashboardUI(projects, payments, logs, inquiries) {
            const totalRev = payments
                .filter(p => (p.status || p.payment_status || '').toLowerCase() === 'paid')
                .reduce((acc, p) => acc + (Number(p.amount) || 0), 0);

            mainView.innerHTML = `
                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="label">Total Settled Revenue</div>
                        <div class="value" style="color: var(--accent-green);">$${totalRev.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                        <div class="subtext">From cleared payments</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Active Projects</div>
                        <div class="value">${projects.filter(p => (p.status || '').toLowerCase() !== 'completed').length}</div>
                        <div class="subtext">In production pipeline</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Total Inquiries</div>
                        <div class="value">${inquiries.length}</div>
                        <div class="subtext">Form submissions</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Logged Transactions</div>
                        <div class="value">${payments.length}</div>
                        <div class="subtext">Total financial records</div>
                    </div>
                </section>

                <nav class="tab-bar">
                    <button class="tab-btn active" onclick="switchTab('tab-projects', this)">
                        Projects & Progress <span class="tab-badge">${projects.length}</span>
                    </button>
                    <button class="tab-btn" onclick="switchTab('tab-payments', this)">
                        Payment Ledger <span class="tab-badge">${payments.length}</span>
                    </button>
                    <button class="tab-btn" onclick="switchTab('tab-logs', this)">
                        Separate Activity Logs <span class="tab-badge">${logs.length}</span>
                    </button>
                    <button class="tab-btn" onclick="switchTab('tab-inquiries', this)">
                        Inquiry Inbox <span class="tab-badge">${inquiries.length}</span>
                    </button>
                </nav>

                <!-- Tab 1: Projects & Percentage Progress -->
                <div id="tab-projects" class="tab-content active">
                    <div class="card">
                        <h3 class="section-title">Create New Client Project</h3>
                        <form id="form-create-project">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Project Title</label>
                                    <input type="text" id="p-title" required placeholder="Custom Web Platform">
                                </div>
                                <div class="form-group">
                                    <label>Client Name</label>
                                    <input type="text" id="p-client-name" required placeholder="John Doe / Acme Corp">
                                </div>
                                <div class="form-group">
                                    <label>Client Email</label>
                                    <input type="email" id="p-email" required placeholder="client@company.com">
                                </div>
                                <div class="form-group">
                                    <label>Client ID / User UUID (Optional)</label>
                                    <input type="text" id="p-client-id" placeholder="e.g. 8f9b2c3d-...">
                                </div>
                                <div class="form-group">
                                    <label>Completion Percentage (%)</label>
                                    <input type="number" id="p-percentage" min="0" max="100" value="0" required>
                                </div>
                                <div class="form-group">
                                    <label>Project Status</label>
                                    <select id="p-status">
                                        <option value="In Progress">In Progress</option>
                                        <option value="Pending Review">Pending Review</option>
                                        <option value="Completed">Completed</option>
                                        <option value="On Hold">On Hold</option>
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label>Project Scope & Details</label>
                                    <textarea id="p-desc" placeholder="Scope details, technical requirements..."></textarea>
                                </div>
                            </div>
                            <button type="submit" class="action-btn">Create Project Record</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3 class="section-title">Registered Client Projects</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Project Name</th>
                                        <th>Client Name & Email</th>
                                        <th>Client ID</th>
                                        <th>Progress Completed (%)</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${projects.length === 0 ? '<tr><td colspan="6" class="text-center text-muted">No projects registered.</td></tr>' : ''}
                                    ${projects.map(p => {
                                        const pct = p.percentage !== undefined && p.percentage !== null ? p.percentage : (p.progress || 0);
                                        return `
                                        <tr>
                                            <td><strong>${escapeHtml(p.title || p.project_name || 'Untitled')}</strong></td>
                                            <td>
                                                <div>${escapeHtml(p.client_name || 'N/A')}</div>
                                                <div style="font-size: 0.8rem; color: var(--text-muted);">${escapeHtml(p.client_email || p.email || 'N/A')}</div>
                                            </td>
                                            <td><span class="client-id-pill">${escapeHtml(p.client_id || p.user_id || 'N/A')}</span></td>
                                            <td style="min-width: 140px;">
                                                <div class="progress-text">${pct}%</div>
                                                <div class="progress-container">
                                                    <div class="progress-bar" style="width: ${pct}%;"></div>
                                                </div>
                                            </td>
                                            <td><span class="status-badge status-${(p.status || 'in-progress').toLowerCase().replace(/\s+/g, '-')}">${escapeHtml(p.status || 'In Progress')}</span></td>
                                            <td><button class="btn-danger" onclick="deleteItem('projects', '${p.id}')">Delete</button></td>
                                        </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Tab 2: Payments Ledger -->
                <div id="tab-payments" class="tab-content">
                    <div class="card">
                        <h3 class="section-title">Log Payment / Invoice Entry</h3>
                        <form id="form-create-payment">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Client Name</label>
                                    <input type="text" id="pay-client" required placeholder="John Doe">
                                </div>
                                <div class="form-group">
                                    <label>Client ID / UUID</label>
                                    <input type="text" id="pay-client-id" placeholder="Optional User UUID">
                                </div>
                                <div class="form-group">
                                    <label>Amount ($ USD)</label>
                                    <input type="number" step="0.01" id="pay-amount" required placeholder="1250.00">
                                </div>
                                <div class="form-group">
                                    <label>Milestone / Milestone Name</label>
                                    <input type="text" id="pay-milestone" placeholder="50% Upfront Deposit">
                                </div>
                                <div class="form-group">
                                    <label>Status</label>
                                    <select id="pay-status">
                                        <option value="Paid">Paid</option>
                                        <option value="Pending">Pending</option>
                                        <option value="Overdue">Overdue</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="action-btn">Log Payment Entry</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3 class="section-title">Financial Transaction Records</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Client Name</th>
                                        <th>Client ID</th>
                                        <th>Milestone Description</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${payments.length === 0 ? '<tr><td colspan="7" class="text-center text-muted">No transactions recorded.</td></tr>' : ''}
                                    ${payments.map(p => `
                                        <tr>
                                            <td>${new Date(p.created_at || Date.now()).toLocaleDateString()}</td>
                                            <td><strong>${escapeHtml(p.client_name || p.email || 'N/A')}</strong></td>
                                            <td><span class="client-id-pill">${escapeHtml(p.client_id || p.user_id || 'N/A')}</span></td>
                                            <td>${escapeHtml(p.milestone || p.notes || 'General Payment')}</td>
                                            <td>$${Number(p.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                                            <td><span class="status-badge status-${(p.status || p.payment_status || 'paid').toLowerCase()}">${escapeHtml(p.status || p.payment_status || 'Paid')}</span></td>
                                            <td><button class="btn-danger" onclick="deleteItem('payments', '${p.id}')">Delete</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Tab 3: Separate Activity Logs -->
                <div id="tab-logs" class="tab-content">
                    <div class="card">
                        <h3 class="section-title">Post Project Log Update</h3>
                        <form id="form-create-log">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Target Project</label>
                                    <select id="log-proj-id" required>
                                        <option value="">-- Choose Target Project --</option>
                                        ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.title || p.project_name)} (${escapeHtml(p.client_name || 'No Client')})</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label>Detailed Activity Log</label>
                                    <textarea id="log-text" required placeholder="Posted update on client dashboard..."></textarea>
                                </div>
                            </div>
                            <button type="submit" class="action-btn">Publish Activity Log</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3 class="section-title">Separate Activity Audit Log</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Timestamp</th>
                                        <th>Project ID</th>
                                        <th>Log Details</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${logs.length === 0 ? '<tr><td colspan="4" class="text-center text-muted">No activity logs recorded.</td></tr>' : ''}
                                    ${logs.map(l => `
                                        <tr>
                                            <td style="white-space: nowrap;">${new Date(l.created_at).toLocaleString()}</td>
                                            <td><code>${escapeHtml(l.project_id || '-')}</code></td>
                                            <td>${escapeHtml(l.log_text || l.message || '')}</td>
                                            <td><button class="btn-danger" onclick="deleteItem('activity_logs', '${l.id}')">Delete</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Tab 4: Inquiry Inbox -->
                <div id="tab-inquiries" class="tab-content">
                    <div class="card">
                        <h3 class="section-title">Inquiry Inbox</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Client Name</th>
                                        <th>Email</th>
                                        <th>Subject</th>
                                        <th>Message</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${inquiries.length === 0 ? '<tr><td colspan="5" class="text-center text-muted">No inquiries received.</td></tr>' : ''}
                                    ${inquiries.map(i => `
                                        <tr>
                                            <td>${new Date(i.created_at).toLocaleDateString()}</td>
                                            <td><strong>${escapeHtml(i.name || i.client_name || 'Anonymous')}</strong></td>
                                            <td>${escapeHtml(i.email || '-')}</td>
                                            <td>${escapeHtml(i.subject || i.service || 'General Inquiry')}</td>
                                            <td>${escapeHtml(i.message || '-')}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            /* ==========================================================================
               FORM SUBMISSION HANDLERS
               ========================================================================== */
            document.getElementById('form-create-project').addEventListener('submit', async (e) => {
                e.preventDefault();
                const client = getSupabase();
                const payload = {
                    title: document.getElementById('p-title').value,
                    project_name: document.getElementById('p-title').value,
                    client_name: document.getElementById('p-client-name').value,
                    client_email: document.getElementById('p-email').value,
                    client_id: document.getElementById('p-client-id').value || null,
                    percentage: parseInt(document.getElementById('p-percentage').value, 10),
                    progress: parseInt(document.getElementById('p-percentage').value, 10),
                    status: document.getElementById('p-status').value,
                    description: document.getElementById('p-desc').value
                };

                const { error } = await client.from('projects').insert([payload]);
                if (error) alert('Error creating project: ' + error.message);
                else loadAdminDashboard();
            });

            document.getElementById('form-create-payment').addEventListener('submit', async (e) => {
                e.preventDefault();
                const client = getSupabase();
                const payload = {
                    client_name: document.getElementById('pay-client').value,
                    client_id: document.getElementById('pay-client-id').value || null,
                    amount: parseFloat(document.getElementById('pay-amount').value),
                    milestone: document.getElementById('pay-milestone').value || 'Payment',
                    status: document.getElementById('pay-status').value,
                    payment_status: document.getElementById('pay-status').value
                };

                const { error } = await client.from('payments').insert([payload]);
                if (error) alert('Error logging payment: ' + error.message);
                else loadAdminDashboard();
            });

            document.getElementById('form-create-log').addEventListener('submit', async (e) => {
                e.preventDefault();
                const client = getSupabase();
                const payload = {
                    project_id: document.getElementById('log-proj-id').value,
                    log_text: document.getElementById('log-text').value
                };

                const { error } = await client.from('activity_logs').insert([payload]);
                if (error) alert('Error posting log: ' + error.message);
                else loadAdminDashboard();
            });
        }

        /* ==========================================================================
           TAB NAVIGATION & DELETE CONTROLLER
           ========================================================================== */
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        async function deleteItem(table, id) {
            if (!confirm(`Are you sure you want to permanently delete this item from ${table}?`)) return;
            const client = getSupabase();
            const { error } = await client.from(table).delete().eq('id', id);
            if (error) alert('Delete error: ' + error.message);
            else loadAdminDashboard();
        }
    </script>
</body>
</html>
