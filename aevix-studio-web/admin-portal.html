<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevix Studio | Admin Portal</title>
    <!-- Supabase JS v2 Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Modern Dark Mode Design System */
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #141418;
            --card-border: #23232a;
            --input-bg: #1c1c22;
            --text-main: #f0f0f5;
            --text-muted: #8e8e9e;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-soft: rgba(99, 102, 241, 0.15);
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* Utilities */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-md { gap: 1rem; }
        .gap-sm { gap: 0.5rem; }

        /* Auth Screen */
        #auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top, rgba(99, 102, 241, 0.1) 0%, transparent 60%);
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Dashboard Screen */
        #dashboard-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 2rem;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--input-bg);
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
        }

        /* Navigation Bar */
        nav {
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 0 2rem;
            display: flex;
            gap: 0.5rem;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 1rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--text-main);
        }

        .nav-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Main Workspace */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .action-bar {
            margin-bottom: 1.5rem;
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        input, select, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Buttons */
        .btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--input-bg);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-sm {
            padding: 0.35rem 0.65rem;
            font-size: 0.8rem;
            border-radius: var(--radius-sm);
        }

        /* Tables & Data Grid */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: #18181c;
            padding: 1rem;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--card-border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.015);
        }

        /* Status Badges */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .badge-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-active, .badge-completed, .badge-paid { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-cancelled, .badge-unpaid { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 1.5rem;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 550px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 1.5rem;
        }

        .modal-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        /* Empty State */
        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Authentication View -->
    <div id="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Aevix Studio</h1>
                <p>Sign in to access administration portal</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="admin@aevixstudio.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Main Administrative Dashboard -->
    <div id="dashboard-container" class="hidden">
        <header class="flex-between">
            <div class="logo-text">Aevix Studio Admin</div>
            <div class="flex gap-md" style="align-items: center;">
                <span id="user-display" class="user-badge">User</span>
                <button onclick="handleLogout()" class="btn btn-secondary btn-sm">Logout</button>
            </div>
        </header>

        <nav>
            <button class="nav-btn active" onclick="switchTab('projects')" id="tab-projects">Projects</button>
            <button class="nav-btn" onclick="switchTab('inquiries')" id="tab-inquiries">Inquiries</button>
            <button class="nav-btn" onclick="switchTab('payments')" id="tab-payments">Payments</button>
        </nav>

        <main>
            <div class="action-bar flex-between">
                <h2 id="tab-title" style="font-size: 1.5rem; font-weight: 600;">Projects</h2>
                <button onclick="openModal()" class="btn">+ Add New Record</button>
            </div>

            <div class="table-container">
                <table id="data-table">
                    <thead id="table-head">
                        <!-- Dynamic Columns -->
                    </thead>
                    <tbody id="table-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
                <div id="empty-state" class="empty-state hidden">
                    No records found for this section.
                </div>
            </div>
        </main>
    </div>

    <!-- Universal Dynamic CRUD Modal -->
    <div id="crud-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size: 1.25rem;">Add Record</h3>
            </div>
            <form id="crud-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="entity-id">
                <div id="modal-fields">
                    <!-- Dynamic Dynamic Form Inputs Injected Here -->
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------------
        // Configuration Parameters
        // Replace SUPABASE_URL & SUPABASE_ANON_KEY with your project credentials.
        // Found in Supabase Dashboard -> Project Settings -> API
        // ------------------------------------------------------------------
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        // Allowed Admin Accounts
        const ADMIN_EMAILS = [
            'admin@aevixstudio.com',
            'dahiyat@aevixstudio.com'
        ];

        // Initialize Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Application State
        let activeTab = 'projects';
        let currentData = [];

        // Entity Schema Definitions for Dynamic UI Engine
        const schemas = {
            projects: {
                title: 'Project',
                fields: [
                    { name: 'name', label: 'Project Name', type: 'text', required: true },
                    { name: 'client_name', label: 'Client Name', type: 'text', required: true },
                    { name: 'budget', label: 'Budget ($)', type: 'number', step: '0.01', required: true },
                    { name: 'status', label: 'Status', type: 'select', options: ['Pending', 'Active', 'Completed', 'Cancelled'], required: true },
                    { name: 'deadline', label: 'Deadline', type: 'date', required: false },
                    { name: 'description', label: 'Description', type: 'textarea', required: false }
                ],
                columns: ['name', 'client_name', 'budget', 'status', 'deadline']
            },
            inquiries: {
                title: 'Inquiry',
                fields: [
                    { name: 'client_name', label: 'Client Name', type: 'text', required: true },
                    { name: 'email', label: 'Email', type: 'email', required: true },
                    { name: 'service_requested', label: 'Service Requested', type: 'text', required: true },
                    { name: 'status', label: 'Status', type: 'select', options: ['Pending', 'Contacted', 'Converted', 'Archived'], required: true },
                    { name: 'message', label: 'Message Details', type: 'textarea', required: true }
                ],
                columns: ['client_name', 'email', 'service_requested', 'status']
            },
            payments: {
                title: 'Payment',
                fields: [
                    { name: 'client_name', label: 'Client Name', type: 'text', required: true },
                    { name: 'amount', label: 'Amount ($)', type: 'number', step: '0.01', required: true },
                    { name: 'payment_status', label: 'Payment Status', type: 'select', options: ['Unpaid', 'Paid', 'Pending', 'Refunded'], required: true },
                    { name: 'due_date', label: 'Due Date', type: 'date', required: true },
                    { name: 'notes', label: 'Payment Notes', type: 'textarea', required: false }
                ],
                columns: ['client_name', 'amount', 'payment_status', 'due_date']
            }
        };

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            verifySessionFast();
        });

        // 1. Session Verification & Auth Handlers
        async function verifySessionFast() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user) {
                if (ADMIN_EMAILS.includes(session.user.email)) {
                    showDashboard(session.user);
                } else {
                    alert('Access Restricted: Your account is not authorized as an Administrator.');
                    await supabase.auth.signOut();
                    showAuth();
                }
            } else {
                showAuth();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Authentication Failed: ' + error.message);
                return;
            }

            if (!ADMIN_EMAILS.includes(data.user.email)) {
                alert('Access Restricted: Your account is not authorized as an Administrator.');
                await supabase.auth.signOut();
                return;
            }

            showDashboard(data.user);
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            showAuth();
        }

        function showAuth() {
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('dashboard-container').classList.add('hidden');
        }

        function showDashboard(user) {
            document.getElementById('user-display').textContent = user.email;
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('dashboard-container').classList.remove('hidden');
            switchTab(activeTab);
        }

        // 2. Navigation & Data Loading
        function switchTab(tabName) {
            activeTab = tabName;
            
            // Update Active Navigation Tab
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // Update Tab Title Header
            document.getElementById('tab-title').textContent = tabName.charAt(0).toUpperCase() + tabName.slice(1);

            fetchTabContent(tabName);
        }

        async function fetchTabContent(table) {
            const tableHead = document.getElementById('table-head');
            const tableBody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');
            
            tableBody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 2rem;">Loading data...</td></tr>';
            emptyState.classList.add('hidden');

            const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });

            if (error) {
                console.error('Data loading error:', error);
                tableBody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--danger); padding: 2rem;">Failed to retrieve records from database.</td></tr>`;
                return;
            }

            currentData = data || [];
            renderTableStructure(table, currentData);
        }

        // 3. Dynamic Rendering Engine
        function renderTableStructure(table, data) {
            const tableHead = document.getElementById('table-head');
            const tableBody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');
            const schema = schemas[table];

            // Render Header
            let headHTML = '<tr>';
            schema.columns.forEach(col => {
                headHTML += `<th>${col.replace('_', ' ')}</th>`;
            });
            headHTML += '<th style="text-align: right;">Actions</th></tr>';
            tableHead.innerHTML = headHTML;

            // Render Body
            tableBody.innerHTML = '';
            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            data.forEach(item => {
                let rowHTML = '<tr>';
                schema.columns.forEach(col => {
                    const value = item[col] !== null && item[col] !== undefined ? item[col] : '-';
                    
                    // Format Status Badges
                    if (col === 'status' || col === 'payment_status') {
                        const statusClass = `badge-${String(value).toLowerCase()}`;
                        rowHTML += `<td><span class="badge ${statusClass}">${value}</span></td>`;
                    } else if (col === 'budget' || col === 'amount') {
                        rowHTML += `<td>$${Number(value).toLocaleString('en-US', { minimumFractionDigits: 2 })}</td>`;
                    } else {
                        rowHTML += `<td>${value}</td>`;
                    }
                });

                // Actions Column
                rowHTML += `
                    <td style="text-align: right;">
                        <button onclick="editRecord('${item.id}')" class="btn btn-secondary btn-sm">Edit</button>
                        <button onclick="deleteRecord('${item.id}')" class="btn btn-danger btn-sm">Delete</button>
                    </td>
                `;
                rowHTML += '</tr>';
                tableBody.insertAdjacentHTML('beforeend', rowHTML);
            });
        }

        // 4. Modal & CRUD Form Operations
        function openModal(editId = null) {
            const schema = schemas[activeTab];
            const modalFields = document.getElementById('modal-fields');
            const modalTitle = document.getElementById('modal-title');
            const entityIdInput = document.getElementById('entity-id');

            modalFields.innerHTML = '';
            entityIdInput.value = editId || '';
            modalTitle.textContent = editId ? `Edit ${schema.title}` : `Add New ${schema.title}`;

            let recordToEdit = null;
            if (editId) {
                recordToEdit = currentData.find(d => String(d.id) === String(editId));
            }

            schema.fields.forEach(field => {
                const formGroup = document.createElement('div');
                formGroup.className = 'form-group';

                const label = document.createElement('label');
                label.textContent = field.label;
                formGroup.appendChild(label);

                let input;
                const value = recordToEdit ? recordToEdit[field.name] : '';

                if (field.type === 'select') {
                    input = document.createElement('select');
                    field.options.forEach(opt => {
                        const option = document.createElement('option');
                        option.value = opt;
                        option.textContent = opt;
                        if (value === opt) option.selected = true;
                        input.appendChild(option);
                    });
                } else if (field.type === 'textarea') {
                    input = document.createElement('textarea');
                    input.value = value || '';
                } else {
                    input = document.createElement('input');
                    input.type = field.type;
                    if (field.step) input.step = field.step;
                    input.value = value || '';
                }

                input.name = field.name;
                if (field.required) input.required = true;

                formGroup.appendChild(input);
                modalFields.appendChild(formGroup);
            });

            document.getElementById('crud-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('crud-modal').classList.add('hidden');
            document.getElementById('crud-form').reset();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const entityId = document.getElementById('entity-id').value;
            const formData = new FormData(e.target);
            const payload = {};

            schemas[activeTab].fields.forEach(field => {
                payload[field.name] = formData.get(field.name);
            });

            let result;
            if (entityId) {
                // Update Record
                result = await supabase.from(activeTab).update(payload).eq('id', entityId);
            } else {
                // Insert New Record
                result = await supabase.from(activeTab).insert([payload]);
            }

            if (result.error) {
                alert('Database Error: ' + result.error.message);
                return;
            }

            closeModal();
            fetchTabContent(activeTab);
        }

        function editRecord(id) {
            openModal(id);
        }

        async function deleteRecord(id) {
            if (!confirm('Are you sure you want to permanently delete this record?')) return;

            const { error } = await supabase.from(activeTab).delete().eq('id', id);

            if (error) {
                alert('Failed to delete record: ' + error.message);
                return;
            }

            fetchTabContent(activeTab);
        }
    </script>
</body>
</html>
