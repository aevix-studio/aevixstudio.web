<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevix Studio | Admin Portal</title>
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f1117;
            --card-bg: #1a1d24;
            --input-bg: #242832;
            --border: #2e3440;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hidden { display: none !important; }

        /* Auth Container */
        #auth-container {
            max-width: 400px;
            margin: auto;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #auth-container h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        button {
            cursor: pointer;
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        button:hover { background: var(--accent-hover); }

        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #4b5563; }
        .btn-secondary:hover { background: #374151; }

        /* Dashboard Layout */
        header {
            background: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        nav {
            display: flex;
            gap: 1rem;
            padding: 1rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }

        nav button {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        nav button.active {
            background: var(--accent);
            color: white;
        }

        main {
            padding: 2rem;
            flex-grow: 1;
        }

        .tab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        /* Data Tables */
        .table-responsive {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background: var(--input-bg);
            color: var(--text-muted);
            font-weight: 600;
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border);
        }

        .modal-content h3 {
            margin-bottom: 1rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Authentication Interface -->
    <div id="auth-container">
        <h2>Aevix Studio Admin</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" required placeholder="aevixstudio962@gmail.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" style="width: 100%;">Login to Portal</button>
        </form>
    </div>

    <!-- Main Admin Dashboard -->
    <div id="dashboard-container" class="hidden">
        <header>
            <h1>Aevix Studio Dashboard</h1>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </header>

        <nav>
            <button id="btn-projects" onclick="switchTab('projects')">Projects</button>
            <button id="btn-inquiries" onclick="switchTab('inquiries')">Inquiries</button>
            <button id="btn-payments" onclick="switchTab('payments')">Payments</button>
        </nav>

        <main>
            <div class="tab-header">
                <h2 id="tab-title">Projects</h2>
                <button onclick="openModal('create')">+ Add Record</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="table-head"></tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Dynamic CRUD Modal -->
    <div id="crud-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title">Record</h3>
            <form id="crud-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="record-id">
                <div id="dynamic-fields"></div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
                    <button type="submit">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize Supabase with Workspace Credentials
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_EMAILS = ['aevixstudio962@gmail.com'];
        let activeTab = 'projects';
        let currentData = [];

        // Tab Column Mappings
        const schema = {
            projects: [
                { name: 'client_name', label: 'Client Name', type: 'text', required: true },
                { name: 'project_title', label: 'Project Title', type: 'text', required: true },
                { name: 'status', label: 'Status', type: 'select', options: ['Pending', 'In Progress', 'Completed', 'On Hold'] },
                { name: 'budget', label: 'Budget ($)', type: 'number', required: true }
            ],
            inquiries: [
                { name: 'contact_name', label: 'Contact Name', type: 'text', required: true },
                { name: 'email', label: 'Email Address', type: 'email', required: true },
                { name: 'message', label: 'Message', type: 'textarea', required: true },
                { name: 'status', label: 'Status', type: 'select', options: ['New', 'Contacted', 'Archived'] }
            ],
            payments: [
                { name: 'client_name', label: 'Client Name', type: 'text', required: true },
                { name: 'amount', label: 'Amount ($)', type: 'number', required: true },
                { name: 'status', label: 'Payment Status', type: 'select', options: ['Unpaid', 'Paid', 'Overdue'] },
                { name: 'due_date', label: 'Due Date', type: 'date', required: true }
            ]
        };

        // Authentication Handlers
        async function verifySessionFast() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && ADMIN_EMAILS.includes(session.user.email)) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard-container').classList.remove('hidden');
                switchTab('projects');
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('dashboard-container').classList.add('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Authentication Failed: ' + error.message);
                return;
            }

            if (!ADMIN_EMAILS.includes(email)) {
                alert('Access Restricted: Non-admin account.');
                await supabase.auth.signOut();
                return;
            }

            verifySessionFast();
        }

        async function logout() {
            await supabase.auth.signOut();
            verifySessionFast();
        }

        // Tab Navigation & Data Operations
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tab}`).classList.add('active');
            document.getElementById('tab-title').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            
            loadTableData();
        }

        async function loadTableData() {
            const { data, error } = await supabase.from(activeTab).select('*').order('created_at', { ascending: false });
            if (error) {
                console.error('Data Fetch Error:', error.message);
                currentData = [];
            } else {
                currentData = data || [];
            }
            renderTable();
        }

        function renderTable() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            const fields = schema[activeTab];

            // Render Headings
            let headHTML = '<th>ID</th>';
            fields.forEach(f => headHTML += `<th>${f.label}</th>`);
            headHTML += '<th>Actions</th>';
            head.innerHTML = headHTML;

            // Render Rows
            if (currentData.length === 0) {
                body.innerHTML = `<tr><td colspan="${fields.length + 2}" style="text-align:center; padding: 2rem;">No records found.</td></tr>`;
                return;
            }

            body.innerHTML = currentData.map(row => {
                let rowHTML = `<tr><td>${row.id}</td>`;
                fields.forEach(f => {
                    rowHTML += `<td>${row[f.name] || '-'}</td>`;
                });
                rowHTML += `
                    <td class="actions-cell">
                        <button onclick="openModal('edit', ${row.id})">Edit</button>
                        <button onclick="deleteRecord(${row.id})" class="btn-danger">Delete</button>
                    </td>
                </tr>`;
                return rowHTML;
            }).join('');
        }

        // Modal Operations
        function openModal(mode, id = null) {
            const modal = document.getElementById('crud-modal');
            const fieldsContainer = document.getElementById('dynamic-fields');
            const fields = schema[activeTab];
            const record = id ? currentData.find(r => r.id === id) : null;

            document.getElementById('modal-title').innerText = `${mode === 'edit' ? 'Edit' : 'Create'} ${activeTab.slice(0, -1)}`;
            document.getElementById('record-id').value = id || '';

            fieldsContainer.innerHTML = fields.map(f => {
                const val = record ? record[f.name] : '';
                if (f.type === 'select') {
                    const options = f.options.map(opt => `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`).join('');
                    return `<div class="form-group"><label>${f.label}</label><select name="${f.name}">${options}</select></div>`;
                } else if (f.type === 'textarea') {
                    return `<div class="form-group"><label>${f.label}</label><textarea name="${f.name}" rows="3" ${f.required ? 'required' : ''}>${val}</textarea></div>`;
                } else {
                    return `<div class="form-group"><label>${f.label}</label><input type="${f.type}" name="${f.name}" value="${val}" ${f.required ? 'required' : ''}></div>`;
                }
            }).join('');

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('crud-modal').classList.add('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('record-id').value;
            const formData = new FormData(e.target);
            const payload = {};

            schema[activeTab].forEach(f => {
                payload[f.name] = formData.get(f.name);
            });

            let error;
            if (id) {
                ({ error } = await supabase.from(activeTab).update(payload).eq('id', id));
            } else {
                ({ error } = await supabase.from(activeTab).insert([payload]));
            }

            if (error) {
                alert('Database Operation Failed: ' + error.message);
            } else {
                closeModal();
                loadTableData();
            }
        }

        async function deleteRecord(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            const { error } = await supabase.from(activeTab).delete().eq('id', id);
            if (error) {
                alert('Deletion Failed: ' + error.message);
            } else {
                loadTableData();
            }
        }

        // Initialize Authentication Status
        verifySessionFast();
    </script>
</body>
</html>
