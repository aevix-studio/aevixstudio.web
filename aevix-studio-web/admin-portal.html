<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Workspace</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 2rem;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1f2937;
        }

        .admin-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
        }

        .logout-btn {
            background-color: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s ease;
        }

        .logout-btn:hover {
            background-color: #4b5563;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .tab-controls {
            display: flex;
            gap: 0.75rem;
        }

        .tab-btn {
            background-color: #111827;
            color: #9ca3af;
            border: 1px solid #1f2937;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #f3f4f6;
            border-color: #374151;
        }

        .tab-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        .add-btn {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .add-btn:hover {
            background-color: #059669;
        }

        .admin-table-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        .admin-table th {
            background-color: #1f2937;
            color: #9ca3af;
            font-weight: 600;
            padding: 0.875rem 1rem;
            border-bottom: 1px solid #374151;
        }

        .admin-table td {
            padding: 1rem;
            border-bottom: 1px solid #1f2937;
            color: #e5e7eb;
        }

        .admin-table tbody tr:last-child td {
            border-bottom: none;
        }

        .admin-table tbody tr:hover {
            background-color: #1a2234;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-active {
            background-color: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.4);
        }

        .badge-completed {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .badge-pending {
            background-color: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .action-btn {
            background: none;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-right: 0.4rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            color: #ffffff;
            border-color: #6b7280;
        }

        .action-btn.delete:hover {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-card h3 {
            margin-bottom: 1.25rem;
            font-size: 1.25rem;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #2563eb;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn-cancel {
            background: #374151;
            color: #f3f4f6;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-save {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <header class="admin-header">
            <h2>Admin Workspace</h2>
            <button id="logout-btn" class="logout-btn" style="display: none;">Logout</button>
        </header>

        <div id="controls-row" class="controls-row" style="display: none;">
            <div class="tab-controls">
                <button class="tab-btn active" onclick="switchTab('projects', event)">Projects</button>
                <button class="tab-btn" onclick="switchTab('inquiries', event)">Inquiries</button>
                <button class="tab-btn" onclick="switchTab('payments', event)">Payments</button>
            </div>
            <button id="add-record-btn" class="add-btn" onclick="openAddModal()">+ Add New Project</button>
        </div>

        <div id="workspace-content">
            <div style="text-align: center; color: #9ca3af; padding: 2rem;">Verifying session permissions...</div>
        </div>
    </div>

    <!-- Dynamic CRUD Modal -->
    <div id="crud-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title">Add Record</h3>
            <form id="crud-form">
                <div id="modal-fields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';
        const ADMIN_EMAILS = ['aevixstudio962@gmail.com', 'aevixstudio961@gmail.com'];
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { flowType: 'pkce', autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
        });

        const workspaceContent = document.getElementById('workspace-content');
        const logoutBtn = document.getElementById('logout-btn');
        const controlsRow = document.getElementById('controls-row');
        const addRecordBtn = document.getElementById('add-record-btn');
        
        let currentTab = 'projects';
        let isAuthorized = false;
        let activeDataCache = [];
        let editingRecordId = null;

        logoutBtn.addEventListener('click', async () => {
            await db.auth.signOut();
            window.location.href = 'index.html';
        });

        async function verifySessionFast() {
            const { data: { session } } = await db.auth.getSession();
            
            if (!session || !session.user) {
                renderAccessDenied("Authentication required to access this workspace.");
                return;
            }

            await checkUserPermissions(session);
        }

        async function checkUserPermissions(session) {
            const userEmail = (session.user.email || '').toLowerCase();
            
            if (ADMIN_EMAILS.includes(userEmail)) {
                grantAccess();
                return;
            }

            try {
                const { data: profile, error } = await db
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (!error && profile && ['admin', 'team'].includes(profile.role)) {
                    grantAccess();
                } else {
                    renderAccessDenied(`Access Denied: Account (${escapeHtml(session.user.email)}) does not have administrative permissions.`);
                }
            } catch (err) {
                renderAccessDenied("An error occurred while verifying user permissions.");
            }
        }

        function grantAccess() {
            if (isAuthorized) return;
            isAuthorized = true;
            logoutBtn.style.display = 'inline-block';
            controlsRow.style.display = 'flex';
            loadActiveTab();
        }

        function switchTab(tabName, evt) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
            
            // Update Add Button label based on tab
            const labelMap = { projects: '+ Add Project', inquiries: '+ Add Inquiry', payments: '+ Add Payment' };
            addRecordBtn.innerText = labelMap[tabName];

            loadActiveTab();
        }

        function loadActiveTab() {
            if (currentTab === 'projects') fetchProjects();
            else if (currentTab === 'inquiries') fetchInquiries();
            else if (currentTab === 'payments') fetchPayments();
        }

        /* --- 1. PROJECTS --- */
        async function fetchProjects() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading projects...</div>`;
            const { data: projects, error } = await db.from('projects').select('*').order('created_at', { ascending: false });

            if (error) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #ef4444;">Failed to fetch projects. Please verify RLS permissions.</div></div>`;
                return;
            }

            activeDataCache = projects || [];

            if (!activeDataCache.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No active projects found. Click "+ Add Project" above to create one.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client Name</th>
                                <th>Project Title</th>
                                <th>Status</th>
                                <th>Deadline</th>
                                <th>Budget</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            activeDataCache.forEach(p => {
                const statusClass = p.status === 'Completed' ? 'badge-completed' : (p.status === 'In Progress' ? 'badge-active' : 'badge-pending');
                html += `
                    <tr>
                        <td><strong>${escapeHtml(p.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(p.project_title || 'N/A')}</td>
                        <td><span class="badge ${statusClass}">${escapeHtml(p.status || 'Pending')}</span></td>
                        <td>${escapeHtml(p.deadline || 'N/A')}</td>
                        <td>$${p.budget ? Number(p.budget).toLocaleString() : '0.00'}</td>
                        <td>
                            <button class="action-btn" onclick="openEditModal('${p.id}')">Edit</button>
                            <button class="action-btn delete" onclick="deleteRecord('projects', '${p.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        /* --- 2. INQUIRIES --- */
        async function fetchInquiries() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading inquiries...</div>`;
            const { data: inquiries, error } = await db.from('inquiries').select('*').order('created_at', { ascending: false });

            if (error) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #ef4444;">Failed to fetch inquiries. Please verify RLS permissions.</div></div>`;
                return;
            }

            activeDataCache = inquiries || [];

            if (!activeDataCache.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No inquiries found.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Email</th>
                                <th>Service</th>
                                <th>Message</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            activeDataCache.forEach(i => {
                html += `
                    <tr>
                        <td><strong>${escapeHtml(i.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(i.email || 'N/A')}</td>
                        <td>${escapeHtml(i.service_requested || 'General')}</td>
                        <td style="max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${escapeHtml(i.message || '')}">${escapeHtml(i.message || 'N/A')}</td>
                        <td><span class="badge badge-active">${escapeHtml(i.status || 'New')}</span></td>
                        <td>
                            <button class="action-btn" onclick="openEditModal('${i.id}')">Edit</button>
                            <button class="action-btn delete" onclick="deleteRecord('inquiries', '${i.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        /* --- 3. PAYMENTS --- */
        async function fetchPayments() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading payments...</div>`;
            const { data: payments, error } = await db.from('payments').select('*').order('created_at', { ascending: false });

            if (error) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #ef4444;">Failed to fetch payments. Please verify RLS permissions.</div></div>`;
                return;
            }

            activeDataCache = payments || [];

            if (!activeDataCache.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No payment records found.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Milestone</th>
                                <th>Amount</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            activeDataCache.forEach(pm => {
                const statusClass = pm.status === 'Paid' ? 'badge-completed' : 'badge-pending';
                html += `
                    <tr>
                        <td><strong>${escapeHtml(pm.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(pm.milestone || 'N/A')}</td>
                        <td>$${pm.amount ? Number(pm.amount).toLocaleString() : '0.00'}</td>
                        <td>${escapeHtml(pm.due_date || 'N/A')}</td>
                        <td><span class="badge ${statusClass}">${escapeHtml(pm.status || 'Unpaid')}</span></td>
                        <td>
                            <button class="action-btn" onclick="openEditModal('${pm.id}')">Edit</button>
                            <button class="action-btn delete" onclick="deleteRecord('payments', '${pm.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        /* --- CRUD MODAL ENGINE --- */
        function openAddModal() {
            editingRecordId = null;
            document.getElementById('modal-title').innerText = `Add New ${currentTab.slice(0, -1)}`;
            renderModalFields();
            document.getElementById('crud-modal').classList.add('active');
        }

        function openEditModal(id) {
            editingRecordId = id;
            const record = activeDataCache.find(r => String(r.id) === String(id));
            if (!record) return;

            document.getElementById('modal-title').innerText = `Edit ${currentTab.slice(0, -1)}`;
            renderModalFields(record);
            document.getElementById('crud-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('crud-modal').classList.remove('active');
            document.getElementById('crud-form').reset();
            editingRecordId = null;
        }

        function renderModalFields(data = {}) {
            const container = document.getElementById('modal-fields');
            let fieldsHtml = '';

            if (currentTab === 'projects') {
                fieldsHtml = `
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" name="client_name" value="${escapeHtml(data.client_name || '')}" required />
                    </div>
                    <div class="form-group">
                        <label>Project Title</label>
                        <input type="text" name="project_title" value="${escapeHtml(data.project_title || '')}" required />
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="In Progress" ${data.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                            <option value="Completed" ${data.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            <option value="Pending" ${data.status === 'Pending' ? 'selected' : ''}>Pending</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="text" name="deadline" placeholder="e.g. Oct 15, 2026" value="${escapeHtml(data.deadline || '')}" />
                    </div>
                    <div class="form-group">
                        <label>Budget ($)</label>
                        <input type="number" step="0.01" name="budget" value="${data.budget || ''}" />
                    </div>
                `;
            } else if (currentTab === 'inquiries') {
                fieldsHtml = `
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" name="client_name" value="${escapeHtml(data.client_name || '')}" required />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" value="${escapeHtml(data.email || '')}" required />
                    </div>
                    <div class="form-group">
                        <label>Service Requested</label>
                        <input type="text" name="service_requested" value="${escapeHtml(data.service_requested || '')}" />
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="New" ${data.status === 'New' ? 'selected' : ''}>New</option>
                            <option value="In Contact" ${data.status === 'In Contact' ? 'selected' : ''}>In Contact</option>
                            <option value="Closed" ${data.status === 'Closed' ? 'selected' : ''}>Closed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea name="message" rows="3">${escapeHtml(data.message || '')}</textarea>
                    </div>
                `;
            } else if (currentTab === 'payments') {
                fieldsHtml = `
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" name="client_name" value="${escapeHtml(data.client_name || '')}" required />
                    </div>
                    <div class="form-group">
                        <label>Milestone</label>
                        <input type="text" name="milestone" value="${escapeHtml(data.milestone || '')}" required />
                    </div>
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" step="0.01" name="amount" value="${data.amount || ''}" required />
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="text" name="due_date" placeholder="e.g. Nov 01, 2026" value="${escapeHtml(data.due_date || '')}" />
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="Unpaid" ${data.status === 'Unpaid' ? 'selected' : ''}>Unpaid</option>
                            <option value="Paid" ${data.status === 'Paid' ? 'selected' : ''}>Paid</option>
                        </select>
                    </div>
                `;
            }

            container.innerHTML = fieldsHtml;
        }

        /* --- SAVE / UPDATE HANDLER --- */
        document.getElementById('crud-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const payload = {};
            
            formData.forEach((value, key) => {
                payload[key] = value;
            });

            let error;
            if (editingRecordId) {
                // Update
                const res = await db.from(currentTab).update(payload).eq('id', editingRecordId);
                error = res.error;
            } else {
                // Insert
                const res = await db.from(currentTab).insert([payload]);
                error = res.error;
            }

            if (error) {
                alert(`Error saving record: ${error.message}`);
                return;
            }

            closeModal();
            loadActiveTab();
        });

        /* --- DELETE HANDLER --- */
        async function deleteRecord(table, id) {
            if (!confirm("Are you sure you want to permanently delete this entry?")) return;

            const { error } = await db.from(table).delete().eq('id', id);

            if (error) {
                alert(`Failed to delete record: ${error.message}`);
                return;
            }

            loadActiveTab();
        }

        function renderAccessDenied(message) {
            logoutBtn.style.display = 'none';
            controlsRow.style.display = 'none';
            workspaceContent.innerHTML = `
                <div style="text-align: center; padding: 4rem 2rem; background: #111827; border: 1px solid #1f2937; border-radius: 12px;">
                    <h3 style="color: #ef4444; margin-top: 0; margin-bottom: 0.5rem;">Restricted Access</h3>
                    <p style="color: #9ca3af; margin-bottom: 1.5rem;">${escapeHtml(message)}</p>
                    <a href="index.html" style="color: #60a5fa; text-decoration: underline;">Return to Main Site</a>
                </div>
            `;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        verifySessionFast();

        db.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                isAuthorized = false;
                renderAccessDenied("Authentication required to access this workspace.");
            } else if (event === 'SIGNED_IN') {
                checkUserPermissions(session);
            }
        });
    </script>
</body>
</html>
