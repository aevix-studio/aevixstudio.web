<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Workspace</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 2rem;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1f2937;
        }

        .admin-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
        }

        .logout-btn {
            background-color: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s ease;
        }

        .logout-btn:hover {
            background-color: #4b5563;
        }

        .tab-controls {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background-color: #111827;
            color: #9ca3af;
            border: 1px solid #1f2937;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #f3f4f6;
            border-color: #374151;
        }

        .tab-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        .admin-table-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        .admin-table th {
            background-color: #1f2937;
            color: #9ca3af;
            font-weight: 600;
            padding: 0.875rem 1rem;
            border-bottom: 1px solid #374151;
        }

        .admin-table td {
            padding: 1rem;
            border-bottom: 1px solid #1f2937;
            color: #e5e7eb;
        }

        .admin-table tbody tr:last-child td {
            border-bottom: none;
        }

        .admin-table tbody tr:hover {
            background-color: #1a2234;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-active {
            background-color: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.4);
        }

        .badge-completed {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .badge-pending {
            background-color: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <header class="admin-header">
            <h2>Admin Workspace</h2>
            <button id="logout-btn" class="logout-btn" style="display: none;">Logout</button>
        </header>

        <div id="tab-controls" class="tab-controls" style="display: none;">
            <button class="tab-btn active" onclick="switchTab('projects', event)">Projects</button>
            <button class="tab-btn" onclick="switchTab('inquiries', event)">Inquiries</button>
            <button class="tab-btn" onclick="switchTab('payments', event)">Payments</button>
        </div>

        <div id="workspace-content">
            <div style="text-align: center; color: #9ca3af; padding: 2rem;">Verifying session permissions...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { flowType: 'pkce', autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
        });

        const workspaceContent = document.getElementById('workspace-content');
        const logoutBtn = document.getElementById('logout-btn');
        const tabControls = document.getElementById('tab-controls');
        let currentTab = 'projects';

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        async function checkUserPermissions(session) {
            if (!session || !session.user) {
                renderAccessDenied("Authentication required to access this workspace.");
                return;
            }

            const userEmail = session.user.email ? session.user.email.toLowerCase() : '';
            
            // Primary operational admin email and legacy backup check
            const isAdminEmail = ['aevixstudio962@gmail.com', 'aevixstudio961@gmail.com'].includes(userEmail);

            if (isAdminEmail) {
                grantAccess();
                return;
            }

            try {
                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (!error && profile && ['admin', 'team'].includes(profile.role)) {
                    grantAccess();
                } else {
                    renderAccessDenied(`Access Denied: Account (${escapeHtml(session.user.email)}) does not have administrative permissions.`);
                }
            } catch (err) {
                renderAccessDenied("An error occurred while verifying user permissions.");
            }
        }

        function grantAccess() {
            logoutBtn.style.display = 'inline-block';
            tabControls.style.display = 'flex';
            loadActiveTab();
        }

        function switchTab(tabName, evt) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
            loadActiveTab();
        }

        function loadActiveTab() {
            if (currentTab === 'projects') fetchProjects();
            else if (currentTab === 'inquiries') fetchInquiries();
            else if (currentTab === 'payments') fetchPayments();
        }

        /* --- 1. PROJECT OVERVIEW TABLE --- */
        async function fetchProjects() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading projects...</div>`;
            const { data: projects, error } = await supabase.from('projects').select('*').order('created_at', { ascending: false });

            if (error || !projects || !projects.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No active projects found.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client Name</th>
                                <th>Project Title</th>
                                <th>Status</th>
                                <th>Deadline</th>
                                <th>Budget</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            projects.forEach(p => {
                const statusClass = p.status === 'Completed' ? 'badge-completed' : (p.status === 'In Progress' ? 'badge-active' : 'badge-pending');
                html += `
                    <tr>
                        <td><strong>${escapeHtml(p.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(p.project_title || 'N/A')}</td>
                        <td><span class="badge ${statusClass}">${escapeHtml(p.status || 'Pending')}</span></td>
                        <td>${escapeHtml(p.deadline || 'N/A')}</td>
                        <td>$${p.budget ? Number(p.budget).toLocaleString() : '0.00'}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        /* --- 2. CLIENT & INQUIRY TRACKER --- */
        async function fetchInquiries() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading inquiries...</div>`;
            const { data: inquiries, error } = await supabase.from('inquiries').select('*').order('created_at', { ascending: false });

            if (error || !inquiries || !inquiries.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No submissions or client inquiries found.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Email</th>
                                <th>Service</th>
                                <th>Message</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            inquiries.forEach(i => {
                html += `
                    <tr>
                        <td><strong>${escapeHtml(i.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(i.email || 'N/A')}</td>
                        <td>${escapeHtml(i.service_requested || 'General')}</td>
                        <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${escapeHtml(i.message || '')}">${escapeHtml(i.message || 'N/A')}</td>
                        <td><span class="badge badge-active">${escapeHtml(i.status || 'New')}</span></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        /* --- 3. PAYMENT & INVOICE STATUS --- */
        async function fetchPayments() {
            workspaceContent.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 2rem;">Loading payment details...</div>`;
            const { data: payments, error } = await supabase.from('payments').select('*').order('created_at', { ascending: false });

            if (error || !payments || !payments.length) {
                workspaceContent.innerHTML = `<div class="admin-table-container"><div style="padding: 2rem; text-align: center; color: #9ca3af;">No payment records found.</div></div>`;
                return;
            }

            let html = `
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Milestone</th>
                                <th>Amount</th>
                                <th>Due Date</th>
                                <th>Payment Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            payments.forEach(pm => {
                const statusClass = pm.status === 'Paid' ? 'badge-completed' : 'badge-pending';
                html += `
                    <tr>
                        <td><strong>${escapeHtml(pm.client_name || 'N/A')}</strong></td>
                        <td>${escapeHtml(pm.milestone || 'N/A')}</td>
                        <td>$${pm.amount ? Number(pm.amount).toLocaleString() : '0.00'}</td>
                        <td>${escapeHtml(pm.due_date || 'N/A')}</td>
                        <td><span class="badge ${statusClass}">${escapeHtml(pm.status || 'Unpaid')}</span></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            workspaceContent.innerHTML = html;
        }

        function renderAccessDenied(message) {
            logoutBtn.style.display = 'none';
            tabControls.style.display = 'none';
            workspaceContent.innerHTML = `
                <div style="text-align: center; padding: 4rem 2rem; background: #111827; border: 1px solid #1f2937; border-radius: 12px;">
                    <h3 style="color: #ef4444; margin-top: 0; margin-bottom: 0.5rem;">Restricted Access</h3>
                    <p style="color: #9ca3af; margin-bottom: 1.5rem;">${escapeHtml(message)}</p>
                    <a href="index.html" style="color: #60a5fa; text-decoration: underline;">Return to Main Site</a>
                </div>
            `;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                renderAccessDenied("Authentication required to access this workspace.");
            } else if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
                await checkUserPermissions(session);
            }
        });
    </script>
</body>
</html>
