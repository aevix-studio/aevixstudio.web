<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | Aevix Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0b0f17;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-green: #4ade80;
            --accent-red: #f87171;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .portal-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .user-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.75rem;
            margin-bottom: 1.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .progress-bar-container {
            background: var(--border-color);
            border-radius: 999px;
            height: 10px;
            overflow: hidden;
            margin: 0.75rem 0 1.25rem 0;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            height: 100%;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1.25rem;
        }

        .stat-box {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-working, .status-in-progress { 
            background: rgba(59, 130, 246, 0.15); 
            color: #60a5fa; 
            border: 1px solid rgba(59, 130, 246, 0.4); 
        }
        .status-delayed { 
            background: rgba(239, 68, 68, 0.15); 
            color: var(--accent-red); 
            border: 1px solid rgba(239, 68, 68, 0.4); 
        }
        .status-completed { 
            background: rgba(34, 197, 94, 0.15); 
            color: var(--accent-green); 
            border: 1px solid rgba(34, 197, 94, 0.4); 
        }

        .logs-container {
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.25rem;
        }

        .log-item {
            border-left: 2px solid var(--accent-blue);
            padding-left: 1rem;
            margin-bottom: 1rem;
        }

        .log-date {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .log-text {
            color: #e5e7eb;
            margin-top: 0.2rem;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .action-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .action-btn:hover { background: #1d4ed8; }

        .logout-btn {
            background: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="portal-header">
            <div>
                <h2 style="margin: 0; font-size: 1.5rem;">Client Dashboard</h2>
                <div id="user-info-display" class="user-info">Authenticating...</div>
            </div>
            <button id="logout-btn" class="logout-btn" style="display: none;">Sign Out</button>
        </div>

        <div id="portal-content">
            <p style="color: var(--text-muted);">Checking session authentication...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';
        
        let supabaseClient = null;

        function getSupabase() {
            if (!supabaseClient) {
                const config = {
                    auth: {
                        flowType: 'pkce',
                        autoRefreshToken: true,
                        persistSession: true,
                        detectSessionInUrl: true
                    }
                };
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, config);
                } else if (typeof createClient === 'function') {
                    supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, config);
                }
            }
            return supabaseClient;
        }

        const portalContent = document.getElementById('portal-content');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfoDisplay = document.getElementById('user-info-display');

        logoutBtn.addEventListener('click', async () => {
            const client = getSupabase();
            if (client) {
                await client.auth.signOut();
            }
            window.location.replace('index.html');
        });

        async function verifyUserAndLoad(session) {
            if (!session || !session.user) {
                renderAuthScreen();
                logoutBtn.style.display = 'none';
                userInfoDisplay.textContent = 'Please sign in to access portal';
                return;
            }

            const email = (session.user.email || '').toLowerCase();
            userInfoDisplay.textContent = `Signed in as ${email}`;

            const client = getSupabase();
            
            // Redirect team/admin profiles to admin portal
            if (email === 'aevixstudio962@gmail.com') {
                window.location.replace('admin-portal.html');
                return;
            }

            try {
                const { data: profile } = await client
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (profile && (profile.role === 'admin' || profile.role === 'team')) {
                    window.location.replace('admin-portal.html');
                    return;
                }
            } catch (err) {
                console.error('Role verification check failed:', err);
            }

            logoutBtn.style.display = 'inline-block';
            await loadClientProjects(session.user.id);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const client = getSupabase();
            if (!client) {
                portalContent.innerHTML = `<p style="color: var(--accent-red);">Unable to load authentication library. Please check network connection.</p>`;
                return;
            }

            const { data: { session } } = await client.auth.getSession();
            await verifyUserAndLoad(session);

            client.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') {
                    await verifyUserAndLoad(session);
                } else if (event === 'SIGNED_OUT' || !session) {
                    renderAuthScreen();
                    logoutBtn.style.display = 'none';
                    userInfoDisplay.textContent = 'Please sign in to access portal';
                }
            });
        });

        function renderAuthScreen() {
            portalContent.innerHTML = `
                <div class="card" style="text-align: center; padding: 3.5rem 1.5rem;">
                    <h3 style="margin-bottom: 0.5rem; font-size: 1.3rem;">Access Your Project Dashboard</h3>
                    <p style="color: var(--text-muted); margin-bottom: 1.75rem;">Sign in with your registered Google account to view active project milestones and timeline logs.</p>
                    <button onclick="triggerGoogleSignIn()" class="action-btn">Sign In with Google</button>
                </div>
            `;
        }

        async function triggerGoogleSignIn() {
            const client = getSupabase();
            if (!client) return;
            await client.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/client-portal.html',
                    queryParams: {
                        access_type: 'offline',
                        prompt: 'consent'
                    }
                }
            });
        }

        async function loadClientProjects(userId) {
            const client = getSupabase();
            
            // Fetch all projects assigned to this client ID
            const { data: projects, error } = await client
                .from('projects')
                .select('*')
                .eq('client_id', userId)
                .order('created_at', { ascending: false });

            if (error) {
                portalContent.innerHTML = `<p style="color: var(--accent-red);">Error loading project data: ${escapeHtml(error.message)}</p>`;
                return;
            }

            if (!projects || projects.length === 0) {
                portalContent.innerHTML = `
                    <div class="card" style="text-align: center; padding: 3rem 1.5rem;">
                        <h3 style="color: var(--accent-blue); margin-bottom: 0.5rem;">No Active Projects Linked</h3>
                        <p style="color: var(--text-muted);">Your account is authenticated, but no active project has been assigned to your profile yet. Please contact the Aevix Studio team.</p>
                    </div>
                `;
                return;
            }

            // Fetch activity logs for all fetched projects in a single batched query
            const projectIds = projects.map(p => p.id);
            const { data: logs } = await client
                .from('activity_logs')
                .select('*')
                .in('project_id', projectIds)
                .order('created_at', { ascending: false });

            // Group activity logs by project_id
            const logsMap = {};
            if (logs) {
                logs.forEach(log => {
                    if (!logsMap[log.project_id]) logsMap[log.project_id] = [];
                    logsMap[log.project_id].push(log);
                });
            }

            renderDashboardUI(projects, logsMap);
        }

        function renderDashboardUI(projects, logsMap) {
            portalContent.innerHTML = projects.map(project => {
                const statusClass = `status-${(project.status || 'working').toLowerCase().replace(/\s+/g, '-')}`;
                const total = Number(project.total_price) || 0;
                const covered = Number(project.fees_covered) || 0;
                const remainingBalance = total - covered;
                const projectLogs = logsMap[project.id] || [];

                let logsHTML = projectLogs.map(log => `
                    <div class="log-item">
                        <div class="log-date">${new Date(log.created_at).toLocaleString()}</div>
                        <div class="log-text">${escapeHtml(log.log_text || '')}</div>
                    </div>
                `).join('');

                if (projectLogs.length === 0) {
                    logsHTML = `<p style="color: var(--text-muted); font-size: 0.88rem;">No timeline updates posted for this project yet.</p>`;
                }

                return `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
                            <div>
                                <h2 style="margin: 0; font-size: 1.4rem;">${escapeHtml(project.title || 'Untitled Project')}</h2>
                                <p style="color: var(--text-muted); margin: 0.25rem 0 0 0; font-size: 0.88rem;">Assigned Lead: ${escapeHtml(project.assigned_to || 'Aevix Team')}</p>
                            </div>
                            <span class="status-badge ${statusClass}">${escapeHtml(project.status || 'working')}</span>
                        </div>

                        <div style="margin-top: 1.5rem;">
                            <div style="display: flex; justify-content: space-between; font-weight: 500; font-size: 0.9rem;">
                                <span>Project Completion</span>
                                <span>${project.progress || 0}%</span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${Math.min(100, Math.max(0, project.progress || 0))}%;"></div>
                            </div>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-label">Target Deadline</div>
                                <div class="stat-value">${project.deadline ? new Date(project.deadline).toLocaleDateString() : 'TBD'}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Contract Value</div>
                                <div class="stat-value">$${total.toLocaleString()}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Payments Cleared</div>
                                <div class="stat-value" style="color: var(--accent-green);">$${covered.toLocaleString()}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Remaining Balance</div>
                                <div class="stat-value" style="color: ${remainingBalance > 0 ? 'var(--accent-red)' : 'var(--accent-green)'};">$${remainingBalance.toLocaleString()}</div>
                            </div>
                        </div>

                        <div class="logs-container">
                            <h4 style="margin: 0 0 1rem 0; font-size: 1rem; color: #e5e7eb;">Project Timeline & Activity</h4>
                            <div>${logsHTML}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
